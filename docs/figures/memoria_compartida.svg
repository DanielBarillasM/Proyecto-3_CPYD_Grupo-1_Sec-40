<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Uso de memoria compartida en la Transformada de Hough</title>
  <desc id="desc">Cada bloque inicializa un acumulador compartido, sincroniza, acumula votos localmente, sincroniza y fusiona sus resultados en memoria global.</desc>
  <defs>
    <linearGradient id="header2" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="86" rx="28" fill="url(#header2)"/>
  <rect x="0" y="58" width="1200" height="28" fill="url(#header2)"/>
  <text x="54" y="54" fill="#ffffff" font-family="Segoe UI, Arial" font-size="30" font-weight="700">Memoria compartida: acumulador por bloque</text>

  <g filter="url(#shadow2)" font-family="Segoe UI, Arial">
    <rect x="44" y="138" width="190" height="122" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="139" y="181" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Entradas globales</text>
    <text x="139" y="217" text-anchor="middle" font-size="17" fill="#475569">Imagen + constantes</text>

    <rect x="315" y="112" width="500" height="348" rx="24" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="565" y="153" text-anchor="middle" font-size="25" font-weight="700" fill="#5b21b6">Bloque CUDA - 256 hilos</text>

    <rect x="355" y="182" width="420" height="66" rx="14" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
    <text x="565" y="210" text-anchor="middle" font-size="19" font-weight="700" fill="#4c1d95">1. Inicialización cooperativa</text>
    <text x="565" y="235" text-anchor="middle" font-size="16" fill="#475569">localAcc[9,000] = 0</text>

    <rect x="355" y="274" width="420" height="72" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="565" y="303" text-anchor="middle" font-size="19" font-weight="700" fill="#4c1d95">2. Votación local</text>
    <text x="565" y="329" text-anchor="middle" font-size="16" fill="#475569">atomicAdd en memoria compartida - 36 KB</text>

    <rect x="355" y="372" width="420" height="64" rx="14" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
    <text x="565" y="400" text-anchor="middle" font-size="19" font-weight="700" fill="#4c1d95">3. Fusión cooperativa</text>
    <text x="565" y="424" text-anchor="middle" font-size="16" fill="#475569">Solo bins no nulos</text>

    <rect x="900" y="188" width="250" height="170" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="1025" y="233" text-anchor="middle" font-size="23" font-weight="700" fill="#9a3412">Acumulador global</text>
    <text x="1025" y="271" text-anchor="middle" font-size="18" fill="#334155">Suma de todos</text>
    <text x="1025" y="299" text-anchor="middle" font-size="18" fill="#334155">los bloques</text>
    <text x="1025" y="331" text-anchor="middle" font-size="16" fill="#ea580c">atomicAdd</text>
  </g>

  <g fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow2)">
    <path d="M234 199 H297"/>
    <path d="M815 404 C850 404 852 315 882 315"/>
  </g>

  <g font-family="Segoe UI, Arial">
    <rect x="525" y="250" width="80" height="24" rx="10" fill="#0f766e"/>
    <text x="565" y="267" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Barrera 1</text>
    <rect x="525" y="348" width="80" height="24" rx="10" fill="#0f766e"/>
    <text x="565" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Barrera 2</text>
  </g>

  <rect x="310" y="505" width="540" height="68" rx="16" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/>
  <text x="580" y="533" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#115e59">Resultado medido en RTX 4050</text>
  <text x="580" y="559" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" fill="#334155">0.800154 ms - 1.359x frente a memoria global</text>
  <text x="42" y="604" font-family="Segoe UI, Arial" font-size="16" fill="#475569">Las barreras sincronizan solo los hilos del bloque; ningún hilo retorna antes de atravesarlas.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Uso de memoria constante en la Transformada de Hough</title>
  <desc id="desc">El host precalcula seno y coseno, los copia a memoria constante y el kernel los comparte por broadcast mientras actualiza un acumulador global.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="86" rx="28" fill="url(#header)"/>
  <rect x="0" y="58" width="1200" height="28" fill="url(#header)"/>
  <text x="54" y="54" fill="#ffffff" font-family="Segoe UI, Arial" font-size="30" font-weight="700">Memoria constante: tablas trigonométricas</text>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial">
    <rect x="50" y="150" width="230" height="140" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="165" y="192" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Host CPU</text>
    <text x="165" y="229" text-anchor="middle" font-size="18" fill="#334155">90 senos + 90 cosenos</text>
    <text x="165" y="260" text-anchor="middle" font-size="18" fill="#334155">720 bytes, solo lectura</text>

    <rect x="370" y="135" width="250" height="170" rx="18" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/>
    <text x="495" y="181" text-anchor="middle" font-size="23" font-weight="700" fill="#115e59">Memoria constante</text>
    <text x="495" y="219" text-anchor="middle" font-size="18" fill="#334155">c_cos[90]</text>
    <text x="495" y="248" text-anchor="middle" font-size="18" fill="#334155">c_sin[90]</text>
    <text x="495" y="281" text-anchor="middle" font-size="16" fill="#0f766e">Broadcast al warp</text>

    <rect x="718" y="125" width="250" height="190" rx="18" fill="#eff6ff" stroke="#0369a1" stroke-width="3"/>
    <text x="843" y="171" text-anchor="middle" font-size="23" font-weight="700" fill="#075985">Kernel CUDA</text>
    <text x="843" y="208" text-anchor="middle" font-size="18" fill="#334155">Un hilo por pixel</text>
    <text x="843" y="239" text-anchor="middle" font-size="18" fill="#334155">r = x cos(theta)</text>
    <text x="843" y="266" text-anchor="middle" font-size="18" fill="#334155">+ y sin(theta)</text>
    <text x="843" y="297" text-anchor="middle" font-size="16" fill="#0369a1">90 iteraciones</text>

    <rect x="996" y="150" width="164" height="140" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="1078" y="191" text-anchor="middle" font-size="21" font-weight="700" fill="#9a3412">Acumulador</text>
    <text x="1078" y="224" text-anchor="middle" font-size="18" fill="#334155">Global</text>
    <text x="1078" y="254" text-anchor="middle" font-size="17" fill="#334155">9,000 bins</text>
  </g>

  <g fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)">
    <path d="M280 220 H352"/>
    <path d="M620 220 H700"/>
    <path d="M968 220 H980"/>
  </g>
  <g font-family="Segoe UI, Arial" font-size="13" fill="#334155">
    <rect x="236" y="96" width="172" height="28" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="322" y="115" text-anchor="middle">cudaMemcpyToSymbol</text>
    <rect x="617" y="96" width="106" height="28" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="670" y="115" text-anchor="middle">lectura uniforme</text>
    <rect x="970" y="96" width="96" height="28" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1018" y="115" text-anchor="middle">atomicAdd</text>
  </g>

  <rect x="718" y="375" width="250" height="78" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="843" y="407" text-anchor="middle" font-family="Segoe UI, Arial" font-size="19" font-weight="700" fill="#0f172a">Imagen PGM global</text>
  <text x="843" y="436" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" fill="#475569">800 x 600 pixels</text>
  <path d="M843 375 V332" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="62" y="482" font-family="Segoe UI, Arial" font-size="17" fill="#475569">Efecto esperado: reducir el costo de leer tablas pequeñas e inmutables; el acumulador sigue sujeto a contención global.</text>
</svg>
